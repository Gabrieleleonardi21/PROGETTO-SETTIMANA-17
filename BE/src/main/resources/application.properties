# I segreti stanno in env.properties (root del progetto, gitignored)
spring.config.import=file:env.properties
spring.application.name=socialnetwork2

# --- Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/socialnetwork2
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Le entita' non escono mai dal service: niente sessione aperta durante la serializzazione
spring.jpa.open-in-view=false

server.port=3001

# --- Sicurezza ---
spring.jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}

# --- Seeder moderatore ---
seed.moderator.username=${SEED_MODERATOR_USERNAME}
seed.moderator.email=${SEED_MODERATOR_EMAIL}
seed.moderator.password=${SEED_MODERATOR_PASSWORD}

# --- Geocoding (step 2) ---
google.geocoding.api-key=${GOOGLE_API_KEY:}
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=5s

# --- OCR Tesseract (step 2) ---
app.ocr.datapath=${OCR_DATAPATH:/opt/homebrew/share/tessdata}
app.ocr.native-lib-path=${OCR_NATIVE_LIB_PATH:/opt/homebrew/lib}
app.ocr.default-language=ita

# --- Upload foto e documenti ---
app.upload.dir=${UPLOAD_DIR:uploads}
# Se cambi il limite aggiorna anche MAX_UPLOAD_BYTE in FE/src/services/api.js
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
